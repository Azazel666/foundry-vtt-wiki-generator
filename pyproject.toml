[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-vtt-wiki-generator"
version = "0.1.0"
description = "Nightly static wiki of the Foundry VTT environments in the Borg-Collective swarm"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "packaging>=24",
    "plyvel>=1.5,<2",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "redis>=5,<7",
    "tzdata",
]

[project.optional-dependencies]
test = ["fakeredis>=2.23", "pytest>=8"]

[project.scripts]
wikigen = "wikigen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wikigen = ["templates/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
