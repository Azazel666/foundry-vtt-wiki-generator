# Local development: the generator against local Foundry Data dirs, the site on http://localhost:8000
# (or WIKI_LOCAL_PORT).
# State lives in a named volume because the publish step needs real symlinks, which a Windows bind mount lacks.
#   docker compose up -d --build
#   docker compose exec generator wikigen run
name: foundry-wiki-dev

services:
  generator:
    build:
      context: .
      target: runtime
    image: foundry-vtt-wiki-generator:dev
    env_file: .env
    environment:
      # One entry per mount below. Order = display order; the first one is the drift reference.
      FOUNDRY_ENVS: |
        - name: main
          path: /foundry/main
        - name: canary
          path: /foundry/canary
    volumes:
      - ${FOUNDRY_MAIN_DATA:?set FOUNDRY_MAIN_DATA in .env}:/foundry/main:ro
      - ${FOUNDRY_CANARY_DATA:?set FOUNDRY_CANARY_DATA in .env}:/foundry/canary:ro
      - state:/state

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${WIKI_LOCAL_PORT:-8000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - state:/state:ro

  test:
    profiles: [test]
    build:
      context: .
      target: test
    image: foundry-vtt-wiki-generator:test

volumes:
  state:
