server {
    listen 80;
    server_name _;

    # current is a symlink, resolved per request, so a publish never serves a half-written site
    root /state/site/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
